name: rat-radar-candidate-deploy

on:
  push:
    branches:
      - feat/binrat-rat-radar-v0
    paths:
      - "src/**"
      - "cloudflare/**"
      - "docs/CAPABILITY_MANIFEST_V0.json"
      - "scripts/deploy-rat-radar-candidate.py"
      - ".github/workflows/rat-radar-candidate-deploy.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

concurrency:
  group: binrat-rat-radar-candidate-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Fail closed unless Cloudflare credentials exist
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?missing CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?missing CLOUDFLARE_ACCOUNT_ID}"

      - run: pnpm install --frozen-lockfile

      - name: Prepare live candidate config
        shell: bash
        run: |
          set -euo pipefail
          cp cloudflare/wrangler.example.jsonc wrangler.jsonc
          sed -i 's/REPLACE_WITH_D1_DATABASE_ID/46814564-1a41-449a-88e5-c1349eed3a27/g' wrangler.jsonc
          sed -i 's#https://REPLACE_WITH_PUBLIC_SITE#https://binrat-edge-v0.pettevik.workers.dev#g' wrangler.jsonc
          sed -i 's/"TELEGRAM_REPLIES_ENABLED": "false"/"TELEGRAM_REPLIES_ENABLED": "true"/g' wrangler.jsonc

      - name: Verify exact candidate gates
        run: |
          python3 -m py_compile scripts/deploy-rat-radar-candidate.py
          pnpm check

      - name: Deploy guarded Rat Radar candidate
        run: python3 scripts/deploy-rat-radar-candidate.py

      - name: Final fail-closed smoke
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://binrat-edge-v0.pettevik.workers.dev/api/health | tee /tmp/health.json
          curl --fail --silent --show-error https://binrat-edge-v0.pettevik.workers.dev/api/rat-radar/watchlist | tee /tmp/radar.json
          holder_status="$(curl --silent --show-error --output /tmp/holder.json --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' \
            --data '{"wallet":"0x0000000000000000000000000000000000000001"}' \
            https://binrat-edge-v0.pettevik.workers.dev/api/holder/challenge)"
          node - <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          const radar = JSON.parse(fs.readFileSync('/tmp/radar.json', 'utf8'));
          const holder = JSON.parse(fs.readFileSync('/tmp/holder.json', 'utf8'));
          if (health.ok !== true || health.indexReady !== true || health.lastSyncError !== null) process.exit(1);
          if (radar.schemaVersion !== 'binrat.rat-radar-watchlist/0.1') process.exit(1);
          if (radar.method?.evidencedRole !== 'V3_SWAP_RECIPIENT') process.exit(1);
          if (holder.error !== 'HOLDER_WALLET_AUTH_NOT_ENABLED') process.exit(1);
          NODE
          test "$holder_status" = "503"


      - name: Report candidate deploy outcome to PR 19
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ job.status }}" = "success" ]; then
            body="RAT_RADAR_REMOTE_DEPLOY: PASS

Head: ${GITHUB_SHA}

Cloudflare candidate deployment + live smoke completed successfully."
          else
            body="RAT_RADAR_REMOTE_DEPLOY: FAIL

Head: ${GITHUB_SHA}

Check the rat-radar-candidate-deploy workflow logs. No launch/token authority was granted."
          fi
          gh pr comment 19 --body "$body"
