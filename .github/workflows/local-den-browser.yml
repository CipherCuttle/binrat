name: local-den-browser
on:
  pull_request:
    paths:
      - 'local-den/**'
      - 'src/workforce/localDen.ts'
      - 'src/workforce/localJob.ts'
      - 'scripts/serve-local-den.mjs'
      - 'scripts/check-local-den-browser.cjs'
      - '.github/workflows/local-den-browser.yml'
permissions:
  contents: read
jobs:
  local-den-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install pinned Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/binrat-playwright" --no-save --no-package-lock playwright@1.56.1
          node "$RUNNER_TEMP/binrat-playwright/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify local Den with isolated synthetic SQLite jobs
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/binrat-playwright/node_modules" node scripts/check-local-den-browser.cjs
      - name: Upload local replay screenshots and proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binrat-local-den-browser
          path: browser-artifacts/local-den/
          retention-days: 7
          if-no-files-found: warn
