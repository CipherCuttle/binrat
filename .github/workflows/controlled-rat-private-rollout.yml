name: controlled-rat-private-rollout

on:
  push:
    branches:
      - feat/binrat-robinhood-live-rat-v1
  workflow_dispatch:
    inputs:
      activation_mode:
        description: Private rollout mode. UI V2 can be dispatched only from its reviewed branch.
        required: true
        default: autonomous-text-private
        type: choice
        options:
          - autonomous-text-private
          - telegram-ui-v2-private
      confirmation:
        description: 'Required exactly for telegram-ui-v2-private: ENABLE_PRIVATE_TELEGRAM_UI_V2'
        required: false
        type: string
      reviewed_sha:
        description: 'Exact 40-character commit SHA reviewed for this deployment'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: binrat-controlled-rat-private-rollout
  cancel-in-progress: false

jobs:
  controlled-private-rat:
    if: ${{ contains(github.event.head_commit.message, '[deploy-controlled-rat]') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.BINRAT_CLOUDFLARE_ADMIN_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.BINRAT_CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET_NEXT: ${{ secrets.TELEGRAM_WEBHOOK_SECRET_NEXT }}
      CONTROLLED_RAT_ALLOWED_USER_ID: ${{ vars.RAT_CANDIDATE_ALLOWED_USER_ID }}
      CONTROLLED_RAT_ALLOWED_USER_ID_FALLBACK: ${{ vars.RAT_FEEDBACK_ADMIN_USER_ID }}
      CONTROLLED_RAT_DEPLOY_APPROVED: 'true'
      CONTROLLED_RAT_ACTIVATION_MODE: ${{ github.event_name == 'push' && 'autonomous-text-private' || inputs.activation_mode }}
      CONTROLLED_RAT_UI_V2_CONFIRMATION: ${{ inputs.confirmation }}
      CONTROLLED_RAT_REVIEWED_SHA: ${{ inputs.reviewed_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Full regression gate
        run: pnpm check

      - name: Telegram configuration plan (read only)
        run: pnpm telegram:plan

      - name: Controlled private Autonomous Rat rollout
        run: node scripts/deploy-controlled-rat.mjs

      - name: Upload replayable private rollout receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binrat-private-telegram-rollout-receipt
          path: .artifacts/telegram-smoke-receipt.json
          retention-days: 30
          if-no-files-found: warn
