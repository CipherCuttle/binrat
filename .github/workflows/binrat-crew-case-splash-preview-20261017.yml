name: BINRAT Crew and Case splash offline web preview
on:
  push:
    branches: [feat/binrat-crew-case-splash-v2-20261017]
    paths:
      - 'web-v2/src/**'
      - 'web/assets/case-splash-sprite.webp'
      - 'web-v2/checks/investigation-shell-browser.cjs'
      - 'scripts/build-githack-preview.mjs'
      - 'scripts/check-githack-preview.mjs'
      - '.github/workflows/binrat-crew-case-splash-preview-20261017.yml'
permissions:
  contents: write
jobs:
  publish-once:
    if: github.repository == 'CipherCuttle/binrat' && github.ref == 'refs/heads/feat/binrat-crew-case-splash-v2-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      BINRAT_GITHACK_BRANCH: binrat-v3-githack-crew-case-splash-20261017
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: true}
      - uses: pnpm/action-setup@v4
        with: {version: 10.15.0, run_install: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Frozen dependencies, no installation scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build production-shaped frontend for offline browser acceptance
        run: |
          node --import tsx --test test/investigationUX.test.ts
          pnpm --dir web-v2 check
          pnpm --dir web-v2 build:frontdoor-candidate
      - name: Verify the actual address icons in pinned Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/binrat-browser" --no-save --no-package-lock playwright@1.56.1
          node "$RUNNER_TEMP/binrat-browser/node_modules/playwright/cli.js" install --with-deps chromium
          BINRAT_FRONTDOOR_TOOLS="$RUNNER_TEMP/binrat-browser/node_modules" node web-v2/checks/investigation-shell-browser.cjs
      - name: Build and verify GitHack preview with recorded Pons data only
        run: |
          node scripts/build-githack-preview.mjs
          node scripts/check-githack-preview.mjs --static
          BINRAT_FRONTDOOR_TOOLS="$RUNNER_TEMP/binrat-browser/node_modules" node scripts/check-githack-preview.mjs
      - name: Publish immutable offline webpage to new GitHack branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "refs/heads/$BINRAT_GITHACK_BRANCH" >/dev/null 2>&1; then
            echo 'STOP: preview already published, never overwrite'; exit 1
          fi
          git diff --quiet
          git diff --cached --quiet
          git switch -c "$BINRAT_GITHACK_BRANCH"
          mkdir -p preview/githack/review
          cp -R .artifacts/githack/site/. preview/githack/
          cp -R .artifacts/investigation-shell/browser/. preview/githack/review/
          cp .artifacts/githack/check.json preview/githack/review/githack-check.json
          git add -f preview/githack
          git config user.name 'binrat-preview'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "preview: approved BINRAT splash thumbnails from $GITHUB_SHA, recorded Pons data only"
          git push origin "HEAD:refs/heads/$BINRAT_GITHACK_BRANCH"
          echo "GITHACK_PUBLISHED https://raw.githack.com/CipherCuttle/binrat/$BINRAT_GITHACK_BRANCH/preview/githack/index.html"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binrat-crew-case-webpage-${{ github.sha }}
          path: |
            .artifacts/investigation-shell/browser/
            .artifacts/githack/check.json
            .artifacts/githack/site/GITHACK_PREVIEW.json
          retention-days: 14
