name: BINRAT Brand Identity Proof

on:
  push:
    branches:
      - design/binrat-brand-system-v1
    paths:
      - ".github/workflows/binrat-brand-identity-proof.yml"
      - "tools/brand/generate-rat-identity-proof.py"
      - "docs/design/brand-v1/canon/rat-zero.jpg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  identity-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proof branch
        uses: actions/checkout@v4
        with:
          ref: design/binrat-brand-system-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic image dependency
        run: python -m pip install "Pillow==11.3.0"

      - name: Generate Rat Zero identity proof
        run: python tools/brand/generate-rat-identity-proof.py

      - name: Verify expected proof files
        run: |
          set -euo pipefail
          test -s docs/design/brand-v1/proofs/identity-v1/rat-zero-reference-768.jpg
          test -s docs/design/brand-v1/proofs/identity-v1/rat-profile-512.png
          test -s docs/design/brand-v1/proofs/identity-v1/rat-avatar-128.png
          test -s docs/design/brand-v1/proofs/identity-v1/rat-avatar-48.png
          test -s docs/design/brand-v1/proofs/identity-v1/rat-avatar-32.png
          test -s docs/design/brand-v1/proofs/identity-v1/rat-mono-128.png
          test -s docs/design/brand-v1/proofs/identity-v1/identity-contact-sheet.png
          test -s docs/design/brand-v1/proofs/identity-v1/manifest.json

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: binrat-identity-proof-v1
          path: docs/design/brand-v1/proofs/identity-v1/
          if-no-files-found: error

      - name: Commit deterministic proof assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design/brand-v1/proofs/identity-v1/
          if git diff --cached --quiet; then
            echo "Proof outputs already current."
            exit 0
          fi
          git commit -m "build(brand): generate Rat Zero identity proof [skip ci]"
          git push origin HEAD:design/binrat-brand-system-v1
