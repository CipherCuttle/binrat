name: pons-token-identity-production-rollout

on:
  push:
    branches:
      - ops/binrat-token-identity-production-rollout-v1

permissions:
  contents: read

concurrency:
  group: binrat-token-identity-production-rollout
  cancel-in-progress: false

jobs:
  rollout:
    if: ${{ contains(github.event.head_commit.message, '[deploy-token-identity-production]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.BINRAT_CLOUDFLARE_ADMIN_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.BINRAT_CLOUDFLARE_ACCOUNT_ID }}
      IDENTITY_PROD_ROLLOUT_APPROVED: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Exact regression and rollout-script syntax gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/ops/binrat-token-identity-production-rollout-v1"
          node --check scripts/rollout-pons-token-identity-production.mjs
          pnpm check

      - name: Guarded token identity production canary
        shell: bash
        run: |
          set -euo pipefail
          node scripts/rollout-pons-token-identity-production.mjs | tee "$RUNNER_TEMP/token-identity-production-rollout.txt"

      - name: Preserve bounded rollout receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: token-identity-production-rollout
          path: ${{ runner.temp }}/token-identity-production-rollout.txt
          retention-days: 30
          if-no-files-found: warn
