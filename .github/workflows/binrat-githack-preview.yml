name: binrat-githack-journey-preview

on:
  push:
    branches:
      - feat/binrat-north-star-slice-g0-g2
    paths:
      - ".github/workflows/binrat-githack-preview.yml"
      - "web-v2/**"
      - "scripts/publish-githack-static.mjs"
      - "src/preview/**"
      - "cloudflare/wrangler.journey-preview.jsonc"
  workflow_dispatch:

# Preview publishing requires an explicit commit tag. The new PR31 branch preserves the older published preview.
concurrency:
  group: binrat-githack-journey-preview
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-journey-preview:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-githack]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check exact frontend contract (root CI remains a separate required gate)
        run: |
          pnpm --dir web-v2 check
      - name: Pin the previously verified, FROZEN read-only Pons snapshot
        shell: bash
        run: |
          set -euo pipefail
          # This is the PR31 *visual* preview, not a new Pons source collection.
          # Leave the existing Pons lane untouched; mark its snapshot stale in-app.
          snapshot="https://raw.githubusercontent.com/CipherCuttle/binrat/c31b1d4726eade25ba257f48022879e538394394/pons-preview-snapshot.json"
          mkdir -p web-v2/public
          curl --fail --silent --show-error --location --retry 3 --max-time 30 "$snapshot" \
            -o web-v2/public/pons-preview-snapshot.json
          test "$(git hash-object web-v2/public/pons-preview-snapshot.json)" = \
            "4c6e6a806638ad805d91855106d1a927a9537307"
          node --input-type=module -e '
            import fs from "node:fs";
            const p=JSON.parse(fs.readFileSync("web-v2/public/pons-preview-snapshot.json","utf8"));
            if(p.chainId!==4663 || p.historyCoverage!=="RECENT_WINDOW_ONLY" ||
               p.confirmationDepth!==12 || p.generatedAt!=="2026-09-25T10:24:53.268Z" ||
               !Array.isArray(p.launches) || p.launches.length!==55)
              throw Error("FROZEN_PONS_PREVIEW_SNAPSHOT_INVALID");
            console.log("FROZEN_PONS_SNAPSHOT_REUSED",p.asOfBlock,p.generatedAt,p.launches.length);
          '
      - name: Compile isolated bento-v1 GitHack frontend
        shell: bash
        run: |
          set -euo pipefail
          VITE_BINRAT_GITHACK_PREVIEW=1 VITE_BINRAT_BENTO_EXPERIMENT=1 pnpm --dir web-v2 exec vite build --base=./
          # Vite's configured publicDir is ../web/assets; the newly acquired Pons
          # snapshot lives in web-v2/public and is deliberately NOT copied by Vite.
          # Include exactly this validated read-only snapshot in the isolated dist.
          install -m 0644 web-v2/public/pons-preview-snapshot.json web-v2/dist/pons-preview-snapshot.json
          cmp web-v2/public/pons-preview-snapshot.json web-v2/dist/pons-preview-snapshot.json
          node web-v2/checks/prepare-githack.mjs
      - name: Install isolated browser
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/binrat-playwright" --no-save --no-package-lock playwright@1.56.1
          node "$RUNNER_TEMP/binrat-playwright/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify bento-v1 and legacy hash routes
        shell: bash
        run: |
          set -euo pipefail
          (
            cd web-v2
            pnpm exec vite preview --host 127.0.0.1 --port 4175
          ) > "$RUNNER_TEMP/githack-vite.log" 2>&1 &
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4175/ >/dev/null; then break; fi
            if [ "$i" -eq 45 ]; then cat "$RUNNER_TEMP/githack-vite.log"; exit 1; fi
            sleep 1
          done
          NODE_PATH="$RUNNER_TEMP/binrat-playwright/node_modules" \
            BINRAT_PREVIEW_URL="http://127.0.0.1:4175" \
            node web-v2/checks/githack-preview-smoke.cjs
          NODE_PATH="$RUNNER_TEMP/binrat-playwright/node_modules" \
            BINRAT_PREVIEW_URL="http://127.0.0.1:4175" \
            node web-v2/checks/pons-preview-smoke.cjs

      - name: Publish ONLY the isolated GitHack bundle branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-githack-static.mjs | tee /tmp/githack-publish.log
          grep -q 'GITHACK_PREVIEW_PUBLISHED' /tmp/githack-publish.log

      - name: Verify GitHack public HTML, JavaScript, CSS and approved artwork
        shell: bash
        run: |
          set -euo pipefail
          site="https://raw.githack.com/CipherCuttle/binrat/preview-binrat-bento-pr31"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location --max-time 20 \
                "$site/preview-build.json" -o /tmp/binrat-preview-build.json && \
                node -e 'const x=require("/tmp/binrat-preview-build.json");if(x.sourceCommit!==process.env.GITHUB_SHA || x.experiment!=="bento-v1")process.exit(1)'; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then echo "::error::GitHack did not expose the published exact source commit"; exit 1; fi
            sleep 5
          done
          curl --fail --silent --show-error --location --max-time 20 "$site/index.html" -o /tmp/binrat-githack-index.html
          node --input-type=module -e '
            import fs from "node:fs";
            const html=fs.readFileSync("/tmp/binrat-githack-index.html","utf8");
            if(!/\.\/assets\/[^" ]+\.js/.test(html) || !/\.\/assets\/[^" ]+\.css/.test(html))
              throw Error("GITHACK_STATIC_INDEX_MISSING_RELATIVE_ASSETS");
          '
          js="$(grep -oE '\./assets/[^"]+\.js' /tmp/binrat-githack-index.html | head -1)"
          css="$(grep -oE '\./assets/[^"]+\.css' /tmp/binrat-githack-index.html | head -1)"
          for item in "$js" "$css" "./binrat-character-master.png"; do
            curl --fail --silent --show-error --location --max-time 20 "$site/${item#./}" -o /dev/null
          done
          echo "PUBLIC_GITHACK_PR31_ASSETS_PASS $site/index.html?experiment=bento-v1#/"

      - name: Verify independent free read-only preview API (Render)
        shell: bash
        run: |
          set -euo pipefail
          proxy="https://binrat-githack-proxy-v2.onrender.com"
          reachable=false
          for n in $(seq 1 10); do
            status="$(curl --silent --show-error --max-time 25 -o /tmp/githack-health.json -w '%{http_code}' \
              -H 'Origin: https://raw.githack.com' "$proxy/api/health" || true)"
            if [ "$status" = "200" ] || [ "$status" = "503" ]; then reachable=true; break; fi
            sleep 5
          done
          if [ "$reachable" != true ]; then
            echo "::warning::GitHack static preview published, but Render API proxy not yet reachable ($status). LIVE mode fails visibly; do not claim end-to-end readiness."
            exit 0
          fi
          test "$(curl --silent --show-error --max-time 25 -o /tmp/githack-post.json -w '%{http_code}' \
            -X POST -H 'Origin: https://raw.githack.com' "$proxy/api/feed")" = "405"
          test "$(curl --silent --show-error --max-time 25 -o /tmp/githack-blocked.json -w '%{http_code}' \
            -H 'Origin: https://raw.githack.com' "$proxy/api/holder/challenge")" = "404"
          curl --fail --silent --show-error --max-time 25 -D /tmp/githack-cors-headers -o /dev/null \
            -X OPTIONS -H 'Origin: https://raw.githack.com' \
            -H 'Access-Control-Request-Method: GET' "$proxy/api/feed"
          grep -qi 'access-control-allow-origin: https://raw.githack.com' /tmp/githack-cors-headers
          echo "PREVIEW_PROXY_READ_ONLY: PASS"
          echo "PUBLIC_UPSTREAM_HTTP_STATUS: $status"
          if [ "$status" != "200" ]; then echo "::warning::Upstream public health unavailable; backend proxy itself is reachable"; fi

      - name: Report exact preview and rollback boundaries
        if: always()
        shell: bash
        run: |
          {
            echo '## BINRAT isolated GitHack user-journey preview'
            echo
            echo '- Source PR: #31 (still draft; owner visual approval pending; isolated review preview only)'
            echo '- Pons read-only snapshot preview: https://raw.githack.com/CipherCuttle/binrat/preview-binrat-bento-pr31/index.html?experiment=bento-v1&source=pons#/'
            echo '- Arc DEMO unchanged: https://raw.githack.com/CipherCuttle/binrat/preview-binrat-bento-pr31/index.html?experiment=bento-v1#/'
            echo '- Backend: https://binrat-githack-proxy-v2.onrender.com/api/health'
            echo '- Public data upstream: binrat-edge-v0.pettevik.workers.dev (read-only, unchanged)'
            echo '- Pons: pinned 2026-09-25T10:24:53Z already verified static snapshot, now STALE; NOT recaptured, real-time, or funding tracing'
            echo '- No token launch, wallet access, Telegram changes, D1 changes, cron, queue or production deploy'
            echo "- Build commit: \`${GITHUB_SHA}\`"
            echo
            if [ -f /tmp/githack-publish.log ]; then
              cat /tmp/githack-publish.log
            else
              echo '**Preview publishing was blocked before the GitHack branch was updated.**'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve GitHack visual-review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: githack-bento-v1-preview-screenshots
          path: web-v2/browser-artifacts/
          retention-days: 7
          if-no-files-found: warn
