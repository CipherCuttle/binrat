name: funder-cohort-once
on:
  push:
    branches: [feat/binrat-funder-cohort-v1]
permissions:
  contents: read
concurrency:
  group: binrat-funder-cohort-20261006-v1
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ github.run_attempt == 1 && github.event.head_commit.message == '[binrat-funder-cohort-20261006-v1]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify offline before permitting RPC
        run: pnpm check
      - name: One fixed retrospective funding recipient cohort
        env:
          BINRAT_ROBINHOOD_ARCHIVE_RPC_URL: ${{ secrets.BINRAT_ROBINHOOD_ARCHIVE_RPC_URL }}
        run: node scripts/capture-funder-cohort.mjs --out "$RUNNER_TEMP/binrat-funder-cohort-20261006-v1" --capture-id funder-cohort-20261006-v1 --source-sha "$GITHUB_SHA"
      - name: Preserve original receipts, selection checkpoint and audit even on halt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binrat-funder-cohort-20261006-v1
          path: ${{ runner.temp }}/binrat-funder-cohort-20261006-v1/
          retention-days: 30
          if-no-files-found: warn
