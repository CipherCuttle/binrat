name: binrat-cloudflare-readonly-diagnostic

on:
  push:
    branches:
      - feat/binrat-frontend-live-integration-pr3
    paths:
      - .github/workflows/binrat-cloudflare-readonly-diagnostic.yml

permissions:
  contents: read

jobs:
  historical-sync-phases:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Query bounded historical sync telemetry without deploying
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !account) throw new Error("CLOUDFLARE_DIAGNOSTIC_CREDENTIALS_UNAVAILABLE");
          const body = {
            queryId: "binrat-sync-diagnostic-20260923",
            timeframe: {
              from: Date.parse("2026-09-23T23:42:20Z"),
              to: Date.parse("2026-09-23T23:43:20Z"),
            },
            dry: true,
            view: "events",
            limit: 200,
            parameters: {
              datasets: ["cloudflare-workers"],
              needle: { value: "SYNC_PHASE|SYNC_QUEUE_UNCAUGHT|SYNC_FAILED", isRegex: true, matchCase: true },
            },
          };
          (async () => {
            const response = await fetch(
              "https://api.cloudflare.com/client/v4/accounts/" + encodeURIComponent(account) +
                "/workers/observability/telemetry/query",
              {
                method: "POST",
                headers: { authorization: "Bearer " + token, "content-type": "application/json" },
                body: JSON.stringify(body),
              },
            );
            const payload = await response.json();
            console.log("Cloudflare query status:", response.status, "success:", payload.success === true);
            if (!response.ok || payload.success !== true) {
              console.log("Cloudflare errors:", JSON.stringify((payload.errors || []).map(e => ({
                code: e.code ?? null, message: String(e.message ?? "").slice(0, 180),
              }))));
              process.exitCode = 1;
              return;
            }
            const events = payload.result?.events?.events ?? [];
            console.log("Returned events:", events.length);
            for (const item of events) {
              const raw = item.source;
              const parsed = typeof raw === "string" ? (() => { try { return JSON.parse(raw); } catch { return {}; } })() : raw ?? {};
              const message = item.$metadata?.message;
              const nested = typeof message === "string" ? (() => { try { return JSON.parse(message); } catch { return {}; } })() : {};
              const d = parsed.event ? parsed : nested.event ? nested : Object.keys(parsed).length ? parsed : nested;
              const service = item.$workers?.scriptName ?? item.$metadata?.service ?? null;
              if (service && service !== "binrat-edge-v0") continue;
              const event = d.event;
              if (!["SYNC_PHASE", "SYNC_QUEUE_UNCAUGHT", "SYNC_FAILED"].includes(event)) continue;
              console.log(JSON.stringify({
                timestamp: item.timestamp ?? null,
                event,
                cycleId: d.cycleId ?? null,
                kind: d.kind ?? null,
                phase: d.phase ?? null,
                code: d.code ?? null,
              }));
            }
          })().catch(error => {
            console.error("Cloudflare query failed:", error.name);
            process.exitCode = 1;
          });
          NODE
