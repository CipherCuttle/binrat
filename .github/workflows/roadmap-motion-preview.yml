name: roadmap-motion-preview

on:
  push:
    branches:
      - feat/binrat-roadmap-living-scenes-v1

permissions:
  contents: read

jobs:
  deploy-preview:
    if: ${{ contains(github.event.head_commit.message, '[deploy-roadmap-motion-preview]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require preview deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Install and build isolated V2
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir web-v2 build

      - name: Prepare static-only preview config
        shell: bash
        run: |
          cat > wrangler.roadmap-motion-preview.jsonc <<'JSON'
          {
            "name": "binrat-roadmap-motion-preview",
            "compatibility_date": "2026-10-01",
            "assets": {
              "directory": "./web-v2/dist",
              "not_found_handling": "single-page-application",
              "html_handling": "none"
            }
          }
          JSON

      - name: Deploy isolated roadmap preview
        shell: bash
        run: |
          set -euo pipefail
          pnpm dlx wrangler@4.135.0 deploy --config wrangler.roadmap-motion-preview.jsonc 2>&1 | tee /tmp/deploy.log
          WORKER_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/deploy.log | tail -1 || true)"
          [ -n "$WORKER_URL" ] || { echo "::error::Wrangler did not emit a workers.dev URL"; exit 1; }
          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"

      - name: Smoke live Motion lab
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if curl -fsS "$WORKER_URL/roadmap-motion-lab" -o /tmp/motion-lab.html; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "::error::Preview did not become reachable"
              exit 1
            fi
            sleep 2
          done
          grep -q '<div id="root"></div>' /tmp/motion-lab.html
          echo "PREVIEW_URL=$WORKER_URL/roadmap-motion-lab" >> "$GITHUB_ENV"

      - name: Record preview URL
        shell: bash
        run: |
          {
            echo '## BINRAT roadmap Motion preview'
            echo
            echo "- commit: `$GITHUB_SHA`"
            echo "- static-only worker: `binrat-roadmap-motion-preview`"
            echo "- Motion lab: $PREVIEW_URL"
            echo "- production worker modified: `false`"
            echo "- D1 / Telegram / API bindings: `none`"
          } >> "$GITHUB_STEP_SUMMARY"
