name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python3 -m py_compile scripts/cutover-cloudflare-telegram.py scripts/publish-cloudflare-capability-manifest.py scripts/deploy-cloudflare-web-assets.py scripts/deploy-rat-watch-candidate.py scripts/deploy-rat-radar-candidate.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm check


  rat-radar-candidate-deploy:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/binrat-rat-radar-v0' }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cloudflare device authorization
        run: pnpm dlx wrangler@4.135.0 login --device --browser=false --no-use-keyring

      - name: Prepare live candidate config
        shell: bash
        run: |
          set -euo pipefail
          cp cloudflare/wrangler.example.jsonc wrangler.jsonc
          sed -i 's/REPLACE_WITH_D1_DATABASE_ID/46814564-1a41-449a-88e5-c1349eed3a27/g' wrangler.jsonc
          sed -i 's#https://REPLACE_WITH_PUBLIC_SITE#https://binrat-edge-v0.pettevik.workers.dev#g' wrangler.jsonc
          sed -i 's/"TELEGRAM_REPLIES_ENABLED": "false"/"TELEGRAM_REPLIES_ENABLED": "true"/g' wrangler.jsonc

      - name: Deploy guarded Rat Radar candidate
        run: python3 scripts/deploy-rat-radar-candidate.py
