name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  graveyard-integrity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/audit -p 'test_graveyard_check.py'
      - run: python3 scripts/audit/graveyard_check.py --event-file "$GITHUB_EVENT_PATH"
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm check
