name: ci

on:
  pull_request:
  push:
    branches: [main]

# Backend-only reset: no frontend build, screenshots, static-site publishing or automatic deploy.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 -m py_compile scripts/cutover-cloudflare-telegram.py scripts/publish-cloudflare-capability-manifest.py scripts/deploy-rat-watch-candidate.py scripts/deploy-rat-radar-candidate.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
