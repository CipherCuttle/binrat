name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python3 -m py_compile scripts/cutover-cloudflare-telegram.py scripts/publish-cloudflare-capability-manifest.py scripts/deploy-cloudflare-web-assets.py scripts/deploy-rat-watch-candidate.py scripts/deploy-rat-radar-candidate.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm check


  rat-radar-candidate-deploy:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Start Cloudflare device authorization
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/cf-device.log"
          pidfile="$RUNNER_TEMP/cf-device.pid"
          codefile="$RUNNER_TEMP/cf-device.txt"
          rm -f "$log" "$pidfile" "$codefile"
          env -u RUNNER_TRACKING_ID nohup pnpm dlx wrangler@4.135.0 login --device --browser=false --no-use-keyring >"$log" 2>&1 </dev/null &
          pid=$!
          echo "$pid" > "$pidfile"
          for _ in $(seq 1 90); do
            if grep -q "https://dash.cloudflare.com/oauth2/device" "$log"; then
              url="$(grep -Eo 'https://dash\.cloudflare\.com/oauth2/device[^[:space:]]*' "$log" | tail -1)"
              code="$(awk '/enter the code:/{getline; getline; gsub(/[[:space:]]/,""); print; exit}' "$log")"
              if [ -n "$url" ] && [ -n "$code" ]; then
                printf 'URL=%s\nCODE=%s\n' "$url" "$code" > "$codefile"
                exit 0
              fi
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$log"
              exit 1
            fi
            sleep 1
          done
          cat "$log"
          exit 1

      - name: Upload Cloudflare device code
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-device-auth
          path: ${{ runner.temp }}/cf-device.txt
          retention-days: 1
          if-no-files-found: error

      - name: Wait for Cloudflare approval
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/cf-device.log"
          pid="$(cat "$RUNNER_TEMP/cf-device.pid")"
          for _ in $(seq 1 300); do
            if grep -q "Successfully logged in" "$log"; then
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$log"
              exit 1
            fi
            sleep 1
          done
          cat "$log"
          exit 1

      - run: pnpm install --frozen-lockfile

      - name: Verify candidate before deploy
        run: pnpm check

      - name: Prepare live candidate config
        shell: bash
        run: |
          set -euo pipefail
          cp cloudflare/wrangler.example.jsonc wrangler.jsonc
          sed -i 's/REPLACE_WITH_D1_DATABASE_ID/46814564-1a41-449a-88e5-c1349eed3a27/g' wrangler.jsonc
          sed -i 's#https://REPLACE_WITH_PUBLIC_SITE#https://binrat-edge-v0.pettevik.workers.dev#g' wrangler.jsonc
          sed -i 's/"TELEGRAM_REPLIES_ENABLED": "false"/"TELEGRAM_REPLIES_ENABLED": "true"/g' wrangler.jsonc

      - name: Deploy guarded Rat Radar candidate
        run: python3 scripts/deploy-rat-radar-candidate.py


  rat-radar-public-smoke:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/binrat-rat-radar-v0' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify live Rat Radar public endpoints
        shell: bash
        run: |
          set -euo pipefail
          base="https://binrat-edge-v0.pettevik.workers.dev"
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 3 "$base/api/health" -o /tmp/health.json
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 3 "$base/api/capabilities" -o /tmp/capabilities.json
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 3 "$base/api/rat-radar/watchlist" -o /tmp/radar.json
          node - <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const caps = JSON.parse(fs.readFileSync('/tmp/capabilities.json','utf8'));
          const radar = JSON.parse(fs.readFileSync('/tmp/radar.json','utf8'));
          console.log('HEALTH', JSON.stringify(health));
          console.log('RAT_RADAR_CAPABILITY', JSON.stringify(caps.capabilities?.ratRadarV0 ?? null));
          console.log('LAUNCH_AUTHORIZATION', JSON.stringify(caps.launchAuthorization ?? null));
          console.log('RAT_RADAR_COVERAGE', JSON.stringify(radar.coverage ?? null));
          console.log('RAT_RADAR_CANDIDATES', JSON.stringify(radar.candidates ?? null));
          if (health.ok !== true || health.indexReady !== true || health.lastSyncError !== null) process.exit(1);
          if (radar.schemaVersion !== 'binrat.rat-radar-watchlist/0.1') process.exit(1);
          if (radar.method?.evidencedRole !== 'V3_SWAP_RECIPIENT') process.exit(1);
          if (caps.launchAuthorization?.status !== 'BLOCKED') process.exit(1);
          NODE
