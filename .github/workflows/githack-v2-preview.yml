name: BINRAT V2 GitHack static demo

on:
  push:
    branches: [binrat-v2-githack-pr23]
    paths:
      - '.github/workflows/githack-v2-preview.yml'
      - 'web-v2/src/**'
      - 'web-v2/checks/responsive-preview.cjs'
      - 'web-v2/index.html'
      - 'web-v2/vite.config.ts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-static-demo:
    # Generated dist-only commits do not trigger another build.
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build static GitHack preview
        run: |
          pnpm --dir web-v2 exec tsc -b
          pnpm --dir web-v2 exec vite build --base /CipherCuttle/binrat/binrat-v2-githack-pr23/web-v2/dist/
          test -s web-v2/dist/index.html
          test -f web-v2/dist/binrat-hero.webp
          test -f web-v2/dist/favicon.png
          grep -q '/CipherCuttle/binrat/binrat-v2-githack-pr23/web-v2/dist/assets/' web-v2/dist/index.html
      - name: Install isolated Playwright Chromium
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/binrat-playwright" --no-save --no-package-lock playwright@1.56.1
          node "$RUNNER_TEMP/binrat-playwright/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify layouts and capture seven viewport widths
        shell: bash
        run: |
          set -euo pipefail
          (cd web-v2 && pnpm exec vite preview --host 127.0.0.1 --port 4174) >"$RUNNER_TEMP/binrat-preview.log" 2>&1 &
          for attempt in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4174/CipherCuttle/binrat/binrat-v2-githack-pr23/web-v2/dist/ >/dev/null; then break; fi
            if [ "$attempt" -eq 50 ]; then cat "$RUNNER_TEMP/binrat-preview.log"; exit 1; fi
            sleep 1
          done
          NODE_PATH="$RUNNER_TEMP/binrat-playwright/node_modules" \
            BINRAT_PREVIEW_URL="http://127.0.0.1:4174/CipherCuttle/binrat/binrat-v2-githack-pr23/web-v2/dist" \
            node web-v2/checks/responsive-preview.cjs
      - name: Upload screenshots from seven viewport widths
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binrat-v2-responsive-viewport-gallery
          path: web-v2/browser-artifacts/responsive/
          retention-days: 7
          if-no-files-found: warn
      - name: Commit generated demo only to isolated preview branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f web-v2/dist/
          if git diff --cached --quiet; then
            echo 'Static preview already current'
            exit 0
          fi
          git commit -m 'build(preview): compile V2 PR23 GitHack demo'
          git push origin HEAD:binrat-v2-githack-pr23
