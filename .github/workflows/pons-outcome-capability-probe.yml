# PR #75 only: read-only live capability proof; no deploy or writes.
name: pons-outcome-capability-probe

on:
  push:
    branches:
      - feat/binrat-pons-outcome-capability-v1

permissions:
  contents: read

jobs:
  live-read-only-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install probe dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate Alchemy Robinhood archive endpoint
        shell: bash
        env:
          ROBINHOOD_RPC_URL: ${{ secrets.BINRAT_ROBINHOOD_ARCHIVE_RPC_URL }}
        run: |
          set -euo pipefail
          test -n "${ROBINHOOD_RPC_URL:-}" || {
            echo "::error::BINRAT_ROBINHOOD_ARCHIVE_RPC_URL is not configured"
            exit 2
          }
          node <<'NODE'
          const raw = process.env.ROBINHOOD_RPC_URL;
          const url = new URL(raw);
          if (url.protocol !== 'https:' ||
              url.hostname !== 'robinhood-mainnet.g.alchemy.com' ||
              url.port !== '' ||
              url.username !== '' ||
              url.password !== '' ||
              url.search !== '' ||
              url.hash !== '' ||
              !/^\/v2\/[A-Za-z0-9_-]{8,128}$/.test(url.pathname)) {
            throw new Error('BINRAT_ROBINHOOD_ARCHIVE_RPC_URL must be a Robinhood Mainnet Alchemy HTTPS endpoint');
          }
          console.log('Alchemy Robinhood archive endpoint shape: PASS');
          NODE

      - name: Probe real Pons historical outcome capability
        shell: bash
        env:
          BINRAT_PUBLIC_BASE_URL: https://binrat-edge-v0.pettevik.workers.dev
          ROBINHOOD_RPC_URL: ${{ secrets.BINRAT_ROBINHOOD_ARCHIVE_RPC_URL }}
        run: |
          set -euo pipefail
          pnpm probe:pons-outcome | tee "$RUNNER_TEMP/pons-outcome-capability-probe.txt"

      - name: Preserve replayable probe receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pons-outcome-capability-probe
          path: ${{ runner.temp }}/pons-outcome-capability-probe.txt
          retention-days: 7
          if-no-files-found: warn
