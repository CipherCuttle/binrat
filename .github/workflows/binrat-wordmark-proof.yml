name: BINRAT Wordmark Proof

on:
  push:
    branches:
      - design/binrat-brand-system-v1
    paths:
      - ".github/workflows/binrat-wordmark-proof.yml"
      - "tools/brand/render-wordmark-proof.py"
      - "docs/design/brand-v1/wordmark-proof-v1/**"
      - "docs/design/brand-v1/proofs/identity-v1/rat-avatar-128.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wordmark-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/binrat-brand-system-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser proof dependency
        run: |
          python -m pip install "playwright==1.55.0"
          python -m playwright install --with-deps chromium

      - name: Render proof
        run: python tools/brand/render-wordmark-proof.py

      - name: Verify proof
        run: test -s docs/design/brand-v1/proofs/wordmark-v1/wordmark-contact-sheet.png

      - uses: actions/upload-artifact@v4
        with:
          name: binrat-wordmark-proof-v1
          path: docs/design/brand-v1/proofs/wordmark-v1/
          if-no-files-found: error

      - name: Commit deterministic proof
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design/brand-v1/proofs/wordmark-v1/
          if git diff --cached --quiet; then
            echo "Proof already current."
            exit 0
          fi
          git commit -m "build(brand): render wordmark proof v1 [skip ci]"
          git push origin HEAD:design/binrat-brand-system-v1
