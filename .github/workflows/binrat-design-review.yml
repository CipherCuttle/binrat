name: BINRAT frontend review desk
on:
  push:
    branches:
      - experiment/binrat-design-review-gallery-20260928
    paths:
      - 'design-review/**'
      - '.github/workflows/binrat-design-review.yml'
  pull_request:
    paths:
      - 'design-review/**'
      - '.github/workflows/binrat-design-review.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Catalog invariants
        run: node --test design-review/test/catalog.test.mjs
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser acceptance at 1440, 390 and 320
        run: node design-review/test/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binrat-design-review-viewport-screenshots
          path: /tmp/binrat-*.png
          if-no-files-found: ignore
