name: case-surface-private-preview

on:
  push:
    branches:
      - ops/binrat-case-surface-private-preview-v1

permissions:
  contents: read

concurrency:
  group: binrat-case-surface-private-preview
  cancel-in-progress: false

jobs:
  private-preview:
    if: ${{ contains(github.event.head_commit.message, '[deploy-private-case-surface]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.BINRAT_CLOUDFLARE_ADMIN_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.BINRAT_CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET_NEXT: ${{ secrets.TELEGRAM_WEBHOOK_SECRET_NEXT }}
      CONTROLLED_RAT_ALLOWED_USER_ID: ${{ vars.RAT_CANDIDATE_ALLOWED_USER_ID }}
      CONTROLLED_RAT_ALLOWED_USER_ID_FALLBACK: ${{ vars.RAT_FEEDBACK_ADMIN_USER_ID }}
      CONTROLLED_RAT_DEPLOY_APPROVED: 'true'
      CONTROLLED_RAT_ACTIVATION_MODE: telegram-ui-v2-private
      CONTROLLED_RAT_UI_V2_CONFIRMATION: ENABLE_PRIVATE_TELEGRAM_UI_V2
      CONTROLLED_RAT_REVIEWED_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Full regression gate
        run: pnpm check

      - name: Telegram configuration plan
        run: pnpm telegram:plan

      - name: Controlled private Case surface preview
        run: node scripts/deploy-controlled-rat.mjs

      - name: Upload rollout receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binrat-case-surface-private-preview-receipt
          path: .artifacts/telegram-smoke-receipt.json
          retention-days: 30
          if-no-files-found: warn
