name: rat-ai-real-model-smoke
on:
  push:
    branches:
      - feat/binrat-rat-conversation-free-ai-v1
permissions:
  contents: read
jobs:
  smoke:
    if: ${{ contains(github.event.head_commit.message, '[smoke-rat-ai]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.BINRAT_CLOUDFLARE_ADMIN_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.BINRAT_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: One bounded model call, no Telegram side effects
        run: node scripts/smoke-rat-ai-live.mjs
