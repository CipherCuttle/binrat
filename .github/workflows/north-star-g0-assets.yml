name: binrat-north-star-g0-art-candidate
on:
  push:
    branches: [feat/binrat-north-star-slice-g0-g2]
    paths:
      - "scripts/north-star/build-g0.py"
      - ".github/workflows/north-star-g0-assets.yml"
  workflow_dispatch:

# This creates reviewable source-derived candidate assets on PR #31 ONLY.
# No release, preview publication, infrastructure mutation, or production deployment.
permissions:
  contents: write
concurrency:
  group: north-star-g0-draft-assets
  cancel-in-progress: false

jobs:
  manufacture-exact-source-layers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/binrat-north-star-slice-g0-g2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pin deterministic art-processing toolchain
        run: python -m pip install "numpy==2.1.3" "pillow==11.1.0" "opencv-python-headless==4.11.0.86"
      - name: Verify master blob identities and derive G0 review assets
        run: python scripts/north-star/build-g0.py
      - name: Verify extraction against original RGB and empty illustration inventory
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          p=Path('web-v2/public/north-star-g0')
          m=json.loads((p/'manifest.json').read_text())
          assert m['status']=='G0_CANDIDATE_OWNER_REVIEW_PENDING'
          assert len(m['portal_illustrations'])==5
          for label in m['portal_illustrations']:
              assert (p/f'portal-{label}-empty.webp').is_file()
              assert (p/f'portal-{label}-icon.png').is_file()
          for name in ('canonical-rat-dumpster','home-visible-rat-dumpster'):
              im=Image.open(p/f'{name}.png')
              assert im.mode=='RGBA' and im.getextrema()[3][0]==0
              assert im.getextrema()[3][1]==255
          print('G0_ASSET_PROVENANCE_AND_ALPHA_CHECK: PASS')
          PY
      - name: Commit G0 candidate derivatives to same draft PR branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-v2/public/north-star-g0/
          if ! git diff --cached --quiet; then
            git commit -m "assets: source-derived G0 rat world and five portal candidates"
            git push origin HEAD:feat/binrat-north-star-slice-g0-g2
          fi
      - name: Preserve candidate artifact for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: north-star-g0-art-candidate
          path: web-v2/public/north-star-g0/
          retention-days: 7
          if-no-files-found: warn
