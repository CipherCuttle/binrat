name: case-surface-live-smoke

on:
  push:
    branches:
      - ops/binrat-case-surface-private-preview-v1

permissions:
  contents: read

jobs:
  live-smoke:
    if: ${{ contains(github.event.head_commit.message, '[smoke-private-case-surface]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.BINRAT_CLOUDFLARE_ADMIN_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.BINRAT_CLOUDFLARE_ACCOUNT_ID }}
      WORKER_URL: https://binrat-edge-v0.pettevik.workers.dev
      EXPECTED_RELEASE_SHA: 53325fd0806765578ed6921428ad55f15a9728f1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve exact deployed private tester read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

          pnpm dlx wrangler@4.135.0 deployments status --name binrat-edge-v0 --json >/tmp/binrat-live-smoke-status.json
          ACTIVE_VERSION="$(node <<'NODE'
          const fs=require('node:fs');
          function parse(path){
            const raw=fs.readFileSync(path,'utf8');
            const positions=[raw.indexOf('{'),raw.indexOf('[')].filter(i=>i>=0);
            if(!positions.length) process.exit(2);
            return JSON.parse(raw.slice(Math.min(...positions)));
          }
          function walk(value){
            if(!value||typeof value!=='object') return null;
            const id=value.version_id??value.versionId;
            const pct=value.percentage??value.percent??value.traffic;
            if(typeof id==='string' && /^[0-9a-f-]{36}$/i.test(id) && (pct===100||pct==='100'||pct===1||pct==='1')) return id;
            for(const child of Array.isArray(value)?value:Object.values(value)){
              const hit=walk(child); if(hit) return hit;
            }
            return null;
          }
          const id=walk(parse('/tmp/binrat-live-smoke-status.json'));
          if(!id) process.exit(3);
          process.stdout.write(id);
          NODE
          )"

          pnpm dlx wrangler@4.135.0 versions view "$ACTIVE_VERSION" --name binrat-edge-v0 --json >/tmp/binrat-live-smoke-version.json
          TESTER_ID_RESOLVED="$(node <<'NODE'
          const fs=require('node:fs');
          const raw=fs.readFileSync('/tmp/binrat-live-smoke-version.json','utf8');
          const positions=[raw.indexOf('{'),raw.indexOf('[')].filter(i=>i>=0);
          if(!positions.length) process.exit(2);
          const parsed=JSON.parse(raw.slice(Math.min(...positions)));
          function walk(value,name){
            if(!value||typeof value!=='object') return null;
            if(value.name===name && value.type==='plain_text' && typeof value.text==='string'){
              const id=value.text.trim();
              if(/^[1-9]\d{3,16}$/.test(id)) return id;
            }
            for(const child of Array.isArray(value)?value:Object.values(value)){
              const hit=walk(child,name); if(hit) return hit;
            }
            return null;
          }
          const candidate=walk(parsed,'RAT_CANDIDATE_ALLOWED_USER_ID');
          const admin=walk(parsed,'RAT_FEEDBACK_ADMIN_USER_ID');
          process.stdout.write(candidate||admin||'');
          NODE
          )"

          if [ -n "$TESTER_ID_RESOLVED" ]; then
            echo "TESTER_SOURCE=ACTIVE_CONFIG" >> "$GITHUB_ENV"
          else
            cat >/tmp/binrat-live-smoke-wrangler.jsonc <<'JSON'
          {
            "name": "binrat-live-case-smoke",
            "main": "src/cloudflare/worker.ts",
            "compatibility_date": "2026-09-18",
            "d1_databases": [{
              "binding": "DB",
              "database_name": "binrat-v0",
              "database_id": "46814564-1a41-449a-88e5-c1349eed3a27"
            }]
          }
          JSON
            pnpm dlx wrangler@4.135.0 d1 execute DB --remote --yes --json \
              --config /tmp/binrat-live-smoke-wrangler.jsonc \
              --command "SELECT CASE WHEN COUNT(*)=1 THEN MAX(user_id) ELSE NULL END AS user_id, COUNT(*) AS matches FROM rat_feedback WHERE body='binrat-controlled-rat-id-0929';" \
              >/tmp/binrat-live-smoke-tester.json
            TESTER_ID_RESOLVED="$(node <<'NODE'
          const fs=require('node:fs');
          const raw=fs.readFileSync('/tmp/binrat-live-smoke-tester.json','utf8');
          const positions=[raw.indexOf('{'),raw.indexOf('[')].filter(i=>i>=0);
          if(!positions.length) process.exit(2);
          const parsed=JSON.parse(raw.slice(Math.min(...positions)));
          const stack=[parsed];
          let hit=null;
          while(stack.length){
            const value=stack.pop();
            if(!value||typeof value!=='object') continue;
            if(Object.hasOwn(value,'matches')&&Object.hasOwn(value,'user_id')) { hit=value; break; }
            for(const child of Array.isArray(value)?value:Object.values(value)) stack.push(child);
          }
          if(!hit||Number(hit.matches)!==1||!/^[1-9]\d{3,16}$/.test(String(hit.user_id??''))) process.exit(3);
          process.stdout.write(String(hit.user_id));
          NODE
          )"
            echo "TESTER_SOURCE=D1_MARKER" >> "$GITHUB_ENV"
          fi

          test -n "$TESTER_ID_RESOLVED"
          echo "TESTER_ID_RESOLVED=$TESTER_ID_RESOLVED" >> "$GITHUB_ENV"
          rm -f /tmp/binrat-live-smoke-status.json /tmp/binrat-live-smoke-version.json \
            /tmp/binrat-live-smoke-tester.json /tmp/binrat-live-smoke-wrangler.jsonc

      - name: Read-only live Case surface smoke
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import { createHmac } from 'node:crypto';

          const worker = process.env.WORKER_URL;
          const token = process.env.TELEGRAM_BOT_TOKEN?.trim() || '';
          const tester = process.env.TESTER_ID_RESOLVED?.trim() || '';
          const expectedSha = process.env.EXPECTED_RELEASE_SHA;

          function gate(ok, code) {
            if (!ok) throw new Error(code);
          }
          async function json(url, init) {
            const response = await fetch(url, {...init, signal:AbortSignal.timeout(20_000)});
            const body = await response.json().catch(()=>null);
            return {response,body};
          }
          function initData() {
            gate(/^\d{4,17}$/.test(tester),'TESTER_ID_INVALID');
            gate(token.length>0,'TELEGRAM_TOKEN_MISSING');
            const fields={
              auth_date:String(Math.floor(Date.now()/1000)),
              query_id:'binrat-live-case-smoke',
              user:JSON.stringify({id:Number(tester),first_name:'BINRAT live Case smoke'})
            };
            const check=Object.entries(fields).sort(([a],[b])=>a.localeCompare(b))
              .map(([key,value])=>key+'='+value).join('\n');
            const secret=createHmac('sha256','WebAppData').update(token).digest();
            const hash=createHmac('sha256',secret).update(check).digest('hex');
            return new URLSearchParams({...fields,hash}).toString();
          }

          const health=await json(worker+'/health');
          gate(health.response.ok && health.body?.ok===true,'LIVE_HEALTH_FAILED');
          gate(health.body.releaseSha===expectedSha,'LIVE_RELEASE_SHA_MISMATCH');

          const appResponse=await fetch(worker+'/app/app.js',{signal:AbortSignal.timeout(20_000)});
          const app=await appResponse.text();
          gate(appResponse.ok,'LIVE_APP_ASSET_FAILED');
          gate(app.includes('/api/miniapp/case-intelligence'),'LIVE_APP_CASE_ENDPOINT_MISSING');
          gate(app.includes('renderCaseWhy'),'LIVE_APP_WHY_MISSING');
          gate(app.includes('renderCaseTrashTrail'),'LIVE_APP_TRASH_TRAIL_MISSING');
          gate(app.includes('renderCaseReplay'),'LIVE_APP_REPLAY_MISSING');
          gate(!app.includes("/api/miniapp/trash-trail"),'LIVE_APP_STANDALONE_TRAIL_REGRESSION');

          const signed=initData();
          const bootstrap=await json(worker+'/api/miniapp/bootstrap',{
            method:'POST',
            headers:{'content-type':'application/json'},
            body:JSON.stringify({initData:signed})
          });
          if(!bootstrap.response.ok) {
            console.log(JSON.stringify({
              event:'LIVE_BOOTSTRAP_FAILED',
              status:bootstrap.response.status,
              error:typeof bootstrap.body?.error==='string'?bootstrap.body.error:null,
              testerSource:process.env.TESTER_SOURCE||null
            }));
          }
          gate(bootstrap.response.ok,'LIVE_BOOTSTRAP_FAILED');
          const launches=Array.isArray(bootstrap.body?.latestLaunches)?bootstrap.body.latestLaunches:[];
          gate(launches.length>0,'LIVE_BOOTSTRAP_NO_LAUNCHES');
          const candidates=launches.filter(item=>typeof item?.launchId==='string' && /^[0-9a-f]{64}$/i.test(item.launchId)).slice(0,10);
          gate(candidates.length>0,'LIVE_BOOTSTRAP_NO_CANONICAL_LAUNCH');

          let launch=null;
          let caseResult=null;
          for(const candidate of candidates) {
            const attempt=await json(worker+'/api/miniapp/case-intelligence',{
              method:'POST',
              headers:{'content-type':'application/json'},
              body:JSON.stringify({initData:signed,launchId:candidate.launchId})
            });
            if(attempt.response.ok) {
              launch=candidate;
              caseResult=attempt;
              break;
            }
            console.log(JSON.stringify({
              event:'LIVE_CASE_ATTEMPT_FAILED',
              launchId:candidate.launchId,
              status:attempt.response.status,
              error:typeof attempt.body?.error==='string'?attempt.body.error:null
            }));
          }
          gate(launch&&caseResult?.response.ok,'LIVE_CASE_INTELLIGENCE_FAILED_ALL_CANDIDATES');
          const body=caseResult.body;

          gate(body?.case?.caseVersion==='BINRAT_CASE_MODEL_V1','LIVE_CASE_VERSION_INVALID');
          gate(body?.case?.current?.launchId===launch.launchId.toLowerCase(),'LIVE_CASE_TARGET_MISMATCH');
          gate(typeof body?.case?.asOfBlock==='string','LIVE_CASE_BLOCK_MISSING');
          gate(body?.trashTrail?.presentationVersion==='BINRAT_PONS_TRASH_TRAIL_PRESENTATION_V1','LIVE_TRAIL_VERSION_INVALID');
          gate(body?.replay?.replayVersion==='BINRAT_PONS_REPLAY_LAB_V1','LIVE_REPLAY_VERSION_INVALID');
          gate(body?.replay?.semantics==='KNOWABLE_AS_OF_BLOCK','LIVE_REPLAY_SEMANTICS_INVALID');
          gate(body?.replay?.targetLaunchId===launch.launchId.toLowerCase(),'LIVE_REPLAY_TARGET_MISMATCH');
          gate(body?.replay?.asOfBlock===body.case.asOfBlock,'LIVE_REPLAY_BLOCK_MISMATCH');
          gate(body?.replay?.targetLaunchKnown===true,'LIVE_REPLAY_TARGET_NOT_KNOWN');
          gate(Array.isArray(body?.case?.facts),'LIVE_CASE_FACTS_INVALID');
          gate(Array.isArray(body?.case?.handoffs),'LIVE_CASE_HANDOFFS_INVALID');
          gate(Array.isArray(body?.trashTrail?.launches),'LIVE_TRAIL_LAUNCHES_INVALID');
          gate(Array.isArray(body?.replay?.previousLaunches),'LIVE_REPLAY_PREVIOUS_INVALID');

          console.log(JSON.stringify({
            status:'LIVE_CASE_SURFACE_SMOKE_PASS',
            releaseSha:health.body.releaseSha,
            launchId:launch.launchId,
            asOfBlock:body.case.asOfBlock,
            factKinds:body.case.facts.map(item=>item.kind),
            handoffs:body.case.handoffs.map(item=>item.kind),
            trashTrailPrevious:body.trashTrail.summary?.previousLaunches ?? null,
            replayPrevious:body.replay.previousLaunches.length,
            fundingCoverage:body.case.coverage?.funding ?? null
          },null,2));
          NODE
