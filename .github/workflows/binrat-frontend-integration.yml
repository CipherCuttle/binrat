name: BINRAT static pixel frontend integration
on:
  push:
    branches:
      - integration/binrat-r5-approved-20260927
    paths:
      - 'prototype/g3a/**'
      - '.github/workflows/binrat-frontend-integration.yml'
  pull_request:
    branches:
      - experiment/binrat-g3b-reviewed-20260926
    paths:
      - 'prototype/g3a/**'
      - '.github/workflows/binrat-frontend-integration.yml'
permissions:
  contents: read
jobs:
  source-build-and-browser-tests:
    if: github.event_name == 'push' && github.ref == 'refs/heads/integration/binrat-r5-approved-20260927'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        working-directory: prototype/g3a
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: prototype/g3a/pnpm-lock.yaml
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test
      - name: Assert no shader, licensed source or superseded bundle
        run: |
          test -z "$(find dist -name '*.map' -print -quit)"
          test -z "$(git ls-files -- src/premium-grain src/officialGrainMount.ts src/grainWave.ts)"
          test -z "$(find dist -iname '*grain*wave*' -o -iname '*three*' -o -iname '*react*')"
          ! grep -RE 'REACTBITS_LICENSE_KEY|@react-three/fiber|official-grain-host' dist
      - name: Explicit G6 safe art readiness
        shell: bash
        run: |
          expected=43541a9b469fbe46a9b54dccb227cfb21c7fcfade1d96656410b124ded2d3edc
          actual="$(sha256sum public/rat-original.jpg | cut -d' ' -f1)"
          test "$actual" = "$expected"
          missing=0
          for art in homepage-panorama-1536x768.png radar-panorama-1536x480.png environment-layer-atlas.png rat-radar-384x256.png replay-lab-384x256.png ledger-384x256.png creator-files-384x256.png watch-384x256.png; do
            if ! test -s "public/g6/$art"; then
              echo "::warning title=G6a art pending::Missing reviewed art public/g6/$art; build currently uses CSS fallback"
              missing=$((missing+1))
            fi
          done
          echo "G6_SAFE_ART_FILES_MISSING=$missing" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload tested static bundle for local viewport review
        uses: actions/upload-artifact@v4
        with:
          name: binrat-g6a-tested-static-bundle
          path: prototype/g3a/dist
          if-no-files-found: error
          retention-days: 7
      - name: Freeze only the tested public bundle and regenerated lockfile
        run: |
          git add -A dist pnpm-lock.yaml
          if ! git diff --cached --quiet -- dist pnpm-lock.yaml; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(frontend): freeze G6 static sunset without Grain Wave'
            git push origin HEAD:refs/heads/integration/binrat-r5-approved-20260927
          fi
      - name: Upload browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binrat-g6-static-frontend-evidence
          path: |
            prototype/g3a/evidence/screenshots
            prototype/g3a/test-results
          if-no-files-found: warn
          retention-days: 7
  published-static-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: prototype/g3a
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: prototype/g3a/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - name: Assert no 3D dependency or old effect bundle
        run: |
          test -z "$(find dist -name '*.map' -print -quit)"
          test -z "$(git ls-files -- src/premium-grain src/officialGrainMount.ts src/grainWave.ts)"
          test -z "$(find dist -iname '*grain*wave*' -o -iname '*three*' -o -iname '*react*')"
      - name: Verify immutable GitHack historical/demo journey
        env:
          PUBLISHED_URL: https://raw.githack.com/CipherCuttle/binrat/${{ github.event.pull_request.head.sha }}/prototype/g3a/dist/index.html
        run: pnpm test:published
