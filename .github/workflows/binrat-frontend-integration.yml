name: BINRAT approved frontend integration
on:
  push:
    branches:
      - integration/binrat-r5-approved-20260927
    paths:
      - 'prototype/g3a/**'
      - '.github/workflows/binrat-frontend-integration.yml'
  pull_request:
    branches:
      - experiment/binrat-g3b-reviewed-20260926
    paths:
      - 'prototype/g3a/**'
      - '.github/workflows/binrat-frontend-integration.yml'
permissions:
  contents: read
jobs:
  source-build-and-browser-tests:
    if: github.event_name == 'push' && github.ref == 'refs/heads/integration/binrat-r5-approved-20260927'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        working-directory: prototype/g3a
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: prototype/g3a/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install the owner's pinned React Bits component (never commit licensed source)
        env:
          REACTBITS_LICENSE_KEY: ${{ secrets.REACTBITS_LICENSE_KEY }}
        run: node scripts/install-licensed-grain.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test
      - name: Verify source distribution boundary
        run: |
          test -z "$(git ls-files -- src/premium-grain)"
          test -z "$(find dist -name '*.map' -print -quit)"
          test -z "$(git status --porcelain -- src/premium-grain)"
          git diff --exit-code -- package.json pnpm-lock.yaml
      - name: Freeze only tested public bundle
        run: |
          git add -A dist
          if ! git diff --cached --quiet -- dist; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(frontend): freeze verified approved R5 distribution'
            git push origin HEAD:refs/heads/integration/binrat-r5-approved-20260927
          fi
      - name: Archive rendered visual evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binrat-approved-r5-integration-evidence
          path: |
            prototype/g3a/evidence/screenshots
            prototype/g3a/test-results
          if-no-files-found: warn
          retention-days: 7
  committed-bundle-and-githack:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: prototype/g3a
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: prototype/g3a/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Never expose licensed TSX or CSS in git
        run: |
          test -z "$(git ls-files -- src/premium-grain)"
          test -z "$(find dist -name '*.map' -print -quit)"
      - run: pnpm test
      - name: Exact immutable GitHack journey
        env:
          PUBLISHED_URL: https://raw.githack.com/CipherCuttle/binrat/${{ github.event.pull_request.head.sha }}/prototype/g3a/dist/index.html
        run: pnpm test:published
      - name: Archive browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binrat-approved-r5-published-evidence
          path: |
            prototype/g3a/evidence/screenshots
            prototype/g3a/test-results
          if-no-files-found: warn
          retention-days: 7
