name: BINRAT Motion Identity Proof

on:
  push:
    branches:
      - design/binrat-motion-identity-v1
    paths:
      - ".github/workflows/binrat-motion-proof.yml"
      - "tools/brand/render-motion-proof.sh"
      - "tools/brand/verify-motion-proof.sh"
      - "docs/design/brand-v1/MOTION_GRAMMAR.md"
      - "docs/design/brand-v1/motion-v1/**"
      - "docs/design/brand-v1/proofs/social-v1/manifest.json"
      - "docs/design/brand-v1/proofs/social-v1/rat-found-wide-1200x675.png"
      - "docs/design/brand-v1/proofs/social-v1/receipt-wide-1200x675.png"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: binrat-motion-proof-v1
  cancel-in-progress: true

jobs:
  motion-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/binrat-motion-identity-v1
          fetch-depth: 0

      - name: Install pinned render toolchain
        shell: bash
        run: |
          set -euo pipefail
          LOCK="docs/design/brand-v1/motion-v1/SOURCE_LOCK.json"
          mapfile -t TOOLCHAIN < <(python3 - "$LOCK" <<'PY'
          import json, sys
          tool = json.load(open(sys.argv[1]))["toolchain"]
          print(tool["ffmpegAptVersion"])
          print(tool["libx264AptVersion"])
          PY
          )
          FFMPEG_APT_VERSION="${TOOLCHAIN[0]}"
          X264_APT_VERSION="${TOOLCHAIN[1]}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "ffmpeg=$FFMPEG_APT_VERSION" \
            "libx264-164=$X264_APT_VERSION"
          test "$(dpkg-query -W -f='${Version}' ffmpeg)" = "$FFMPEG_APT_VERSION"
          test "$(dpkg-query -W -f='${Version}' libx264-164)" = "$X264_APT_VERSION"
          ffmpeg -version | head -n 1

      - name: Render twice and prove deterministic bytes
        shell: bash
        run: |
          set -euo pipefail
          MOTION="docs/design/brand-v1/proofs/motion-v1/found-something-v1.mp4"
          MANIFEST="docs/design/brand-v1/proofs/motion-v1/manifest.json"

          bash tools/brand/render-motion-proof.sh
          FIRST_MOTION="$(sha256sum "$MOTION" | awk '{print $1}')"
          FIRST_MANIFEST="$(sha256sum "$MANIFEST" | awk '{print $1}')"

          bash tools/brand/render-motion-proof.sh
          SECOND_MOTION="$(sha256sum "$MOTION" | awk '{print $1}')"
          SECOND_MANIFEST="$(sha256sum "$MANIFEST" | awk '{print $1}')"

          test "$FIRST_MOTION" = "$SECOND_MOTION"
          test "$FIRST_MANIFEST" = "$SECOND_MANIFEST"
          printf 'PASS deterministic render: motion=%s manifest=%s\n' "$SECOND_MOTION" "$SECOND_MANIFEST"

      - name: Verify motion proof
        run: bash tools/brand/verify-motion-proof.sh

      - uses: actions/upload-artifact@v4
        with:
          name: binrat-motion-proof-v1
          path: docs/design/brand-v1/proofs/motion-v1/
          if-no-files-found: error

      - name: Commit deterministic proof
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin refs/heads/design/binrat-motion-identity-v1 | cut -f1)"
          if [ "$REMOTE_HEAD" != "$GITHUB_SHA" ]; then
            echo "Branch advanced while this run was rendering; skip stale proof push."
            echo "run_sha=$GITHUB_SHA remote_head=$REMOTE_HEAD"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design/brand-v1/proofs/motion-v1/
          if git diff --cached --quiet; then
            echo "Proof already current."
            exit 0
          fi
          git commit -m "build(brand): render motion identity proof v1 [skip ci]"
          git push origin HEAD:design/binrat-motion-identity-v1
