name: pons-outcome-production-preflight

on:
  push:
    branches:
      - feat/binrat-pons-outcome-receipts-v1

permissions:
  contents: read

jobs:
  preflight:
    if: ${{ contains(github.event.head_commit.message, '[o2-prod-preflight]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.BINRAT_CLOUDFLARE_ADMIN_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.BINRAT_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Read-only production O2 preflight
        shell: bash
        run: |
          set -euo pipefail
          node scripts/preflight-pons-outcome-production.mjs | tee "$RUNNER_TEMP/pons-outcome-production-preflight.json"

      - name: Preserve preflight receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pons-outcome-production-preflight
          path: ${{ runner.temp }}/pons-outcome-production-preflight.json
          retention-days: 7
          if-no-files-found: warn
