name: telegram-menu-forensics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-menu-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.BINRAT_CLOUDFLARE_ADMIN_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.BINRAT_CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CONTROLLED_RAT_ALLOWED_USER_ID: ${{ vars.RAT_CANDIDATE_ALLOWED_USER_ID }}
      CONTROLLED_RAT_ALLOWED_USER_ID_FALLBACK: ${{ vars.RAT_FEEDBACK_ADMIN_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read global and controlled-tester menu scopes
        run: node scripts/telegram-menu-forensics.mjs
      - name: Read Mini App endpoint status
        run: curl --silent --show-error --location --output /dev/null --write-out 'MINI_APP_HTTP_STATUS=%{http_code}\n' https://binrat-edge-v0.pettevik.workers.dev/app/
