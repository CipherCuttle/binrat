name: hot-garbage-preregister

on:
  push:
    branches: [experiment/72h-hot-garbage-v0]
    paths:
      - scripts/hot-garbage-preregister.mjs
      - .github/workflows/hot-garbage-preregister.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Capture immutable experiment start
        run: node scripts/hot-garbage-preregister.mjs | tee hot-garbage-v0-start.json
        env:
          ARC_RPC_URL: https://rpc.arc-scan.org
      - uses: actions/upload-artifact@v4
        with:
          name: hot-garbage-v0-start
          path: hot-garbage-v0-start.json
          if-no-files-found: error
