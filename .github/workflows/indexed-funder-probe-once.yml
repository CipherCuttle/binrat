name: indexed-funder-probe-once
on:
  push:
    branches: [feat/binrat-indexed-archive-probe-v1]
permissions:
  contents: read
concurrency:
  group: binrat-indexed-archive-probe-20261006-v1
  cancel-in-progress: false
jobs:
  capture:
    if: ${{ github.run_attempt == 1 && github.event.head_commit.message == '[binrat-indexed-capture-20261006-v1]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify offline before permitting RPC
        run: pnpm check
      - name: One read-only range using the existing archive secret
        env:
          BINRAT_ROBINHOOD_ARCHIVE_RPC_URL: ${{ secrets.BINRAT_ROBINHOOD_ARCHIVE_RPC_URL }}
        run: node scripts/probe-indexed-funder.mjs --out "$RUNNER_TEMP/binrat-indexed-capture-20261006-v1" --capture-id indexed-archive-20261006-v1 --source-sha "$GITHUB_SHA"
      - name: Preserve raw journal and audit even on halt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binrat-indexed-capture-20261006-v1
          path: ${{ runner.temp }}/binrat-indexed-capture-20261006-v1/
          retention-days: 30
          if-no-files-found: warn
