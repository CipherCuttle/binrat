name: case-evidence-ui
on:
  pull_request:
    paths:
      - 'web-v2/src/PonsCasePreview.tsx'
      - 'web-v2/src/historicalCase.ts'
      - 'web-v2/src/frontdoor-discovery.css'
      - 'web-v2/checks/*case*'
      - 'src/public/caseEvidence.ts'
      - 'test/support/caseProductionCapture.ts'
      - '.github/workflows/case-evidence-ui.yml'
permissions:
  contents: read
jobs:
  historical-case:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-public-release.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec tsx --test test/caseEvidence.test.ts test/publicProjection.test.ts test/cloudflareWorker.test.ts web-v2/checks/check-historical-case.ts
      - run: node web-v2/checks/check-pons-readonly-preview.mjs
      - run: node web-v2/checks/build-frontdoor-candidate.mjs --production
      - name: Pinned compiled browser evidence over captured real source
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/binrat-playwright" --no-save --no-package-lock playwright@1.56.1
          node "$RUNNER_TEMP/binrat-playwright/node_modules/playwright/cli.js" install --with-deps chromium
          pnpm exec tsx web-v2/checks/serve-case-evidence-local.ts > "$RUNNER_TEMP/case-server.log" 2>&1 &
          CASE_SERVER_PID=$!
          trap 'kill "$CASE_SERVER_PID"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4192/ > /dev/null; then break; fi
            sleep 1
          done
          BINRAT_FRONTDOOR_TOOLS="$RUNNER_TEMP/binrat-playwright/node_modules" node web-v2/checks/case-evidence-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: case-evidence-ui-${{ github.event.pull_request.head.sha }}
          path: docs/receipts/sprint-a1-2-ui/
          retention-days: 14
