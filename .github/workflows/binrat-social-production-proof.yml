name: BINRAT Social Production Proof

on:
  push:
    branches:
      - design/binrat-social-production-v1
    paths:
      - ".github/workflows/binrat-social-production-proof.yml"
      - "tools/brand/validate-social-production.mjs"
      - "tools/brand/render-social-production.py"
      - "docs/design/brand-v1/social-v1/social.js"
      - "docs/design/brand-v1/social-production-v1/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: binrat-social-production-proof-v1
  cancel-in-progress: true

jobs:
  social-production-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Static syntax gate
        run: |
          node --check docs/design/brand-v1/social-v1/social.js
          node --check docs/design/brand-v1/social-production-v1/production.js
          node --check tools/brand/validate-social-production.mjs

      - name: Validate structured content
        run: node tools/brand/validate-social-production.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser proof dependency
        run: |
          python -m pip install "playwright==1.55.0"
          python -m playwright install --with-deps chromium

      - name: Re-render frozen Social V1 regression proof
        run: |
          python tools/brand/render-social-proof.py
          git diff --exit-code -- docs/design/brand-v1/proofs/social-v1

      - name: Render mutation contact sheets
        run: python tools/brand/render-social-production.py

      - name: Verify proof outputs
        run: |
          set -euo pipefail
          for f in contact-wide.png contact-square.png manifest.json
          do
            test -s "docs/design/brand-v1/proofs/social-production-v1/$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: binrat-social-production-v1
          path: docs/design/brand-v1/proofs/social-production-v1/
          if-no-files-found: error

      - name: Commit deterministic proof
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design/brand-v1/proofs/social-production-v1/
          if git diff --cached --quiet; then
            echo "Proof already current."
            exit 0
          fi
          git commit -m "build(brand): render social production proof [skip ci]"
          git push origin HEAD:"$GITHUB_REF_NAME"
