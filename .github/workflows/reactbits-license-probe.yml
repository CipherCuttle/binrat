name: React Bits Pro license probe (isolated)

on:
  push:
    branches:
      - experiment/binrat-reactbits-license-probe-20260926
    paths:
      - .github/workflows/reactbits-license-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-cta5-entitlement:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify repo secret can access licensed CTA 5 registry
        shell: bash
        env:
          REACTBITS_LICENSE_KEY: ${{ secrets.REACTBITS_LICENSE_KEY }}
        run: |
          set -euo pipefail
          set +x

          if [[ -z "${REACTBITS_LICENSE_KEY:-}" ]]; then
            echo "FAIL: REACTBITS_LICENSE_KEY is not available to this workflow."
            exit 1
          fi
          echo "Secret is available to this workflow; checking CTA 5 entitlement..."

          # The two probes distinguish a missing/invalid secret from Starter-only access.
          # No licensed response body, header or key is printed or uploaded.
          starter_file="$RUNNER_TEMP/reactbits-starter-private.json"
          pro_file="$RUNNER_TEMP/reactbits-cta5-private.json"
          trap 'rm -f "$starter_file" "$pro_file"' EXIT

          starter_status="$(curl --silent --show-error --location --retry 1 --max-time 30 \
            --output "$starter_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${REACTBITS_LICENSE_KEY}" \
            'https://pro.reactbits.dev/api/r/starter/mono-waves-tw.json')"
          pro_status="$(curl --silent --show-error --location --retry 1 --max-time 30 \
            --output "$pro_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${REACTBITS_LICENSE_KEY}" \
            'https://pro.reactbits.dev/api/r/pro/cta-5.json')"

          # One separate Pro block differentiates a CTA 5-specific issue from tier-wide denial.
          control_file="$RUNNER_TEMP/reactbits-pro-control-private.json"
          trap 'rm -f "$starter_file" "$pro_file" "$control_file"' EXIT
          control_status="$(curl --silent --show-error --location --retry 1 --max-time 30 \
            --output "$control_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${REACTBITS_LICENSE_KEY}" \
            'https://pro.reactbits.dev/api/r/pro/hero-1.json')"

          # Only safe status summaries; error payloads and licensed source remain private.
          echo "Starter component: HTTP $starter_status"
          echo "Pro CTA 5: HTTP $pro_status"
          echo "Pro hero-1 control: HTTP $control_status"

          if [[ "$starter_status" == "200" ]]; then
            node - "$starter_file" <<'NODE'
          const fs = require('node:fs');
          try {
            const data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
            if (!Array.isArray(data.files) || data.files.length < 1) process.exit(1);
            console.log('PASS: starter registry entitlement authenticated.');
          } catch {
            console.error('FAIL: starter response is not a valid registry item.');
            process.exit(1);
          }
          NODE
          else
            echo "Starter component unavailable (HTTP $starter_status)."
          fi

          if [[ "$pro_status" == "200" ]]; then
            node - "$pro_file" <<'NODE'
          const fs = require('node:fs');
          try {
            const data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
            if (!Array.isArray(data.files) || data.files.length < 1) process.exit(1);
            console.log('PASS: CTA 5 registry entitlement authenticated.');
          } catch {
            console.error('FAIL: CTA 5 response is not a valid registry item.');
            process.exit(1);
          }
          NODE
          else
            # Classify the provider error without echoing its response body or the secret.
            node - "$pro_file" <<'NODE'
          const fs = require('node:fs');
          let body = {};
          try { body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8')); } catch {}
          const msg = [body.error, body.message, body.code].filter(x => typeof x === 'string').join(' ').toLowerCase();
          let reason = 'UNCLASSIFIED_DENIAL';
          if (/invalid|unrecognized|unknown/.test(msg) && /key|license|token/.test(msg)) reason = 'INVALID_KEY';
          else if (/expired|revoked/.test(msg)) reason = 'EXPIRED_OR_REVOKED';
          else if (/starter|upgrade|plan|tier|entitlement/.test(msg)) reason = 'PLAN_OR_ENTITLEMENT';
          else if (/rate limit|quota|too many/.test(msg)) reason = 'RATE_LIMITED';
          else if (/missing|unauthorized/.test(msg) && /key|license|token/.test(msg)) reason = 'MISSING_OR_REJECTED_AUTH';
          console.log('Provider error category: ' + reason);
          NODE
            echo "CTA 5 remains inaccessible (HTTP $pro_status)."
            exit 1
          fi
