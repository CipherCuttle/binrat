name: pons-outcome-deployment-rehearsal

on:
  push:
    branches:
      - feat/binrat-pons-outcome-receipts-v1

permissions:
  contents: read

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rehearse pre-O2 schema upgrade and disabled candidate
        shell: bash
        run: |
          set -euo pipefail
          pnpm rehearse:pons-outcome-deployment | tee "$RUNNER_TEMP/pons-outcome-deployment-rehearsal.txt"

      - name: Preserve rehearsal receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pons-outcome-deployment-rehearsal
          path: ${{ runner.temp }}/pons-outcome-deployment-rehearsal.txt
          retention-days: 7
          if-no-files-found: warn
